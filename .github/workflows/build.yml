name: Build images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # Daily rebuild to pick up OS and PHP security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/php-forgejo-runner
  LATEST_PHP: "8.4"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        # min = lowest patch release with all known security fixes. Raise it
        # when PHP ships a security release, so older builds can't be published.
        include:
          - php: "8.3"
            min: "8.3.36" # CVE-2026-109618, CVE-2026-109619
          - php: "8.4"
            min: "8.4.27" # CVE-2026-109618, CVE-2026-109619
          - php: "8.5"
            min: "8.5.12" # CVE-2026-109618, CVE-2026-109619
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Forgejo stops sending jobs to runners that are too old, so always build
      # with the latest runner release. Forgejo's own instance, not GitHub —
      # the runner is not published as a GitHub release.
      - name: Resolve latest runner version
        id: runner
        run: |
          version=$(curl -fsSL --retry 3 \
            https://code.forgejo.org/api/v1/repos/forgejo/runner/releases/latest \
            | jq -r .tag_name | sed 's/^v//')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::unexpected runner version '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          images=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            hub=docker.io/$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            images="$images $hub/php-forgejo-runner"
          fi
          tags=""
          for image in $images; do
            tags="$tags,$image:${{ matrix.php }},$image:${{ matrix.php }}-$(date -u +%Y%m%d)"
            if [ "${{ matrix.php }}" = "$LATEST_PHP" ]; then tags="$tags,$image:latest"; fi
          done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_MIN_VERSION=${{ matrix.min }}
            APT_CACHE_BUST=${{ steps.tags.outputs.date }}
            RUNNER_VERSION=${{ steps.runner.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          cache-from: type=gha,scope=php-${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

  dockerhub-description:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync README to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/php-forgejo-runner
          short-description: "Self-hosted Forgejo Actions runner with PHP 8.3-8.5, Composer and Node, for host-mode CI."
          readme-filepath: ./README.md
          enable-url-completion: true
